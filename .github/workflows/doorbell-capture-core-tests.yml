name: Doorbell Capture Core Tests

on:
  push:
    branches:
      - doorbell-capture-core
    paths:
      - nest_capture.py
      - requirements-doorbell.txt
      - tests/test_nest_capture.py
      - .github/workflows/doorbell-capture-core-tests.yml
  pull_request:
    branches:
      - main
    paths:
      - nest_capture.py
      - requirements-doorbell.txt
      - tests/test_nest_capture.py
      - .github/workflows/doorbell-capture-core-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture dependencies
        run: python -m pip install -r requirements-doorbell.txt
      - name: Compile
        run: python -m py_compile nest_capture.py tests/test_nest_capture.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
