name: Doorbell Media Preflight

on:
  push:
    branches:
      - doorbell-media-preflight
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install system media packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -version
          ffmpeg -hide_banner -decoders | grep -i h264 || true
          ffmpeg -hide_banner -encoders | grep -i 264 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WebRTC dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiortc av numpy pillow cryptography

      - name: Validate real Nest capture client
        run: python -m py_compile nest_capture.py package_result.py

      - name: Run WebRTC H264 decode preflight
        run: python doorbell_preflight.py

      - name: Prepare encrypted transport preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('transport_preflight_request.json').read_text())
          Path('artifacts/transport-result.json').write_text(json.dumps({
              'success': True,
              'request_id': request['request_id'],
              'stage': 'synthetic_transport_preflight'
          }))
          PY
          python package_result.py \
            --request transport_preflight_request.json \
            --result artifacts/transport-result.json \
            --image artifacts/decoded-frame.png \
            --out artifacts/sealed

      - name: Upload synthetic media diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doorbell-media-preflight
          path: |
            artifacts/decoded-frame.png
            artifacts/preflight-report.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload encrypted return-path artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doorbell-transport-preflight
          path: artifacts/sealed/
          if-no-files-found: error
          retention-days: 1
